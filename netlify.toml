# Sdrawkcab — static site, no build step.
[build]
  publish = "src"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # The game needs the microphone, and nothing else.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No catch-all redirect on purpose: this is a single page with no client-side
# routing, and a catch-all would turn every missing asset into a 200 that
# serves HTML — which hides real 404s and would poison the service worker cache.

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/app.webmanifest"
  [headers.values]
    # Netlify serves an unknown extension as octet-stream; the spec type is
    # what browsers expect for an installable app.
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
