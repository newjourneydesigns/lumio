<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF3D2">
<title>Sdrawkcab — talk backwards, badly</title>
<meta name="description" content="Say a phrase. Hear it backwards. Say the backwards bit. Hear that backwards. A party game for your mouth.">

<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="manifest" href="./app.webmanifest">

<!-- Installed-app behaviour. iOS reads these rather than the manifest. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sdrawkcab">

<!-- Share card. This game spreads by being sent into group chats, so the
     unfurl is doing real work. og:image must be an absolute URL. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sdrawkcab">
<meta property="og:url" content="https://sdrawkcab.netlify.app/">
<meta property="og:title" content="Sdrawkcab — talk backwards, badly">
<meta property="og:description" content="Say a phrase. Hear it backwards. Now say the backwards bit out loud. We flip that around — if you nailed it, your phrase comes back.">
<meta property="og:image" content="https://sdrawkcab.netlify.app/assets/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sdrawkcab: say it forwards, hear the gibberish, copy the gibberish, flip it back.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sdrawkcab — talk backwards, badly">
<meta name="twitter:description" content="Say a phrase. Hear it backwards. Now say the backwards bit out loud. We flip that around — if you nailed it, your phrase comes back.">
<meta name="twitter:image" content="https://sdrawkcab.netlify.app/assets/og.png">

<link rel="stylesheet" href="./fonts.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<a class="skip-link" href="#stage">Skip to the game</a>

<header class="topbar">
  <h1 class="wordmark" aria-label="Sdrawkcab"><span aria-hidden="true">Sdrawkcab</span></h1>
  <button type="button" class="icon-btn" id="help-btn" aria-haspopup="dialog">
    <span aria-hidden="true">?</span><span class="sr-only">How to play</span>
  </button>
</header>

<main id="stage">
  <p class="tagline" id="tagline"></p>

  <ol class="steps" id="steps">
    <!-- Steps are rendered by game.js so the copy lives in exactly one place. -->
  </ol>

  <section class="result" id="result" hidden aria-live="polite">
    <p class="result-kicker" id="result-kicker"></p>
    <h2 class="result-title" id="result-title"></h2>

    <div class="compare">
      <p class="compare-label">What you said <span>vs</span> what came back</p>
      <div class="wave-box compare-box">
        <canvas id="compare-wave" aria-label="Your original recording overlaid with your reversed imitation"></canvas>
      </div>
      <div class="compare-legend">
        <span class="key key-ghost"></span> the original
        <span class="key key-solid"></span> your attempt
      </div>
    </div>

    <div class="result-actions">
      <button type="button" class="btn btn-primary" id="again-btn"></button>
      <button type="button" class="btn btn-secondary" id="retry-btn"></button>
      <button type="button" class="btn btn-ghost" id="share-btn"></button>
    </div>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<dialog class="sheet" id="help-sheet">
  <h2>How to play</h2>
  <ol class="how-list" id="how-list"></ol>
  <section class="diagnostics" id="diagnostics" hidden>
    <h3>Something went wrong?</h3>
    <p>Send this to whoever built it and they will know what broke.</p>
    <textarea id="diagnostics-text" readonly rows="6" aria-label="Diagnostic details"></textarea>
    <button type="button" class="btn btn-ghost" id="copy-diagnostics">Copy details</button>
  </section>
  <button type="button" class="btn btn-primary" id="help-close">Got it</button>
</dialog>

<dialog class="sheet" id="blocker-sheet">
  <h2 id="blocker-title"></h2>
  <p id="blocker-body"></p>
  <button type="button" class="btn btn-primary" id="blocker-close">OK</button>
</dialog>

<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script type="module" src="./js/main.js"></script>
</body>
</html>
