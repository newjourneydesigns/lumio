[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lumio-leads"
version = "0.1.0"
description = "Find local businesses without websites — your next web-design clients."
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
lumio = "lumio:cli"

[tool.setuptools]
py-modules = ["lumio"]
